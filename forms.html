<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>
<body>
    <fieldset>
       <legend>Identifying Information</legend> 
        <label>First Name:</label>
        <input type="text" name="" value="" placeholder="Your First Name" required>
        <label>Last Name:</label>
        <input type="text" name="" value="" placeholder="Your Last Name" required>
        <label>Email Address:</label>
        <input type="email" name="" value="" placeholder="Your Email" required><br><br>
        <label>Street Address:</label>
        <input type="text" name="" value="">
        <label>City:</label>
        <input type="text" name="" value="" >
        <label>State:</label>
        <input type="text" name="" value="">
        <label>Zipcode:</label>
        <input type="number" name="" value=""required >
    </fieldset>
    <fieldset>
        <legend>Selections</legend>
        <h2>Color Selection</h2>
        <label>Red</label>
        <input type="radio" name="" value="">
        <label>Blue</label>
        <input type="radio" name="" value="">
        <label>Green</label>
        <input type="radio" name="" value="">
        <label>White</label>
        <input type="radio" name="" value="">
        <label>Black</label>
        <input type="radio" name="" value="">

        <h2>Product Selection</h2>
        <label>Rug</label>
        <input type="checkbox" name="" value="">
        <label>Quantity</label>
        <input type="number" name="" value=""  min="0" max="100" >
        <label>Sweater</label>
        <input type="checkbox" name="" value="">
        <label>Quantity</label>
        <input type="number" name="" value=""  min="0" max="100" >
        <label>Curtain</label>
        <input type="checkbox" name="" value="">
        <label>Quantity</label>
        <input type="number" name="" value=""  min="0" max="100" >
        <label>Towel</label>
        <input type="checkbox" name="" value="">
        <label>Quantity</label>
        <input type="number" name="" value=""  min="0" max="100" >
    </fieldset>
    <fieldset>
        <legend>Shipping Selection</legend>
        <label>Select type of shipping</label>
        <select>
            <option value="">one Day Shipping</option>
            <option value="">Two Day Shipping</option>
            <option value="">A Week Day Shipping</option>
        </select>
    </fieldset>
    <fieldset>
        <legend>Submit your order</legend>
        <textarea placeholder="Enter any special instructions" rows="8" cols="50"></textarea><br><br>
        <input type="submit" name="">
    </fieldset>
            
</body>
</html>
